# Compose file for people who do not use Unraid templates.
#
#   docker compose up -d
#
# The two security_opt values are required on hosts whose kernel lacks Landlock
# (Unraid 7.3.x and other appliance kernels) so the bundled bubblewrap sandbox
# can create its namespaces. See docs/unraid-sandbox.md for the full reasoning
# and the trade-off. On a Landlock-capable kernel you may drop them.
services:
  deepseek-harness:
    image: ${DSH_IMAGE:-ghcr.io/OWNER/deepseek-harness:latest}
    container_name: deepseek-harness
    restart: unless-stopped
    ports:
      - "${DSH_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # Leave empty for a trusted LAN; set https://your.host when an
      # authenticating reverse proxy fronts this container.
      PUBLIC_URL: ${PUBLIC_URL:-}
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-}
    volumes:
      - ./data:/data
      - ./workspace:/workspace
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
