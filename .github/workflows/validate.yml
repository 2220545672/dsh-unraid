name: validate

# The template repository's gate. The image's own checks (Dockerfile lint, Caddy
# validation, the container smoke test) run in 2220545672/dsh-docker; what matters
# here is that the Community Applications template is well-formed, that the icon is
# reproducible, and that the template still matches the image it installs
# (scripts/check-image-contract.mjs).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static gate (template, CA requirements, image contract, icon)
        run: bash scripts/check-static.sh

      - name: Shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck scripts/*.sh

      - name: Template scripts run end to end
        run: |
          set -euo pipefail
          node scripts/check-repo.mjs
          node scripts/check-template.mjs templates/dsh.xml
          # render-template.mjs is the fork helper (it substitutes owner/repo/tag);
          # the committed template is already rendered, which is what CA parses.
          node scripts/render-template.mjs --owner=example --repo=dsh-unraid --tag=latest --out=/tmp/dsh.xml
          node scripts/check-template.mjs /tmp/dsh.xml
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('/tmp/dsh.xml'); print('rendered template is well-formed XML')"
          # The composed icon is committed; scripts/make-icon.mjs needs sharp, which CI
          # deliberately does not install, so only its PNG header is verified here.
          node -e '
            const fs = require("node:fs");
            const buf = fs.readFileSync("templates/img/dsh.png");
            const signature = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);
            if (!buf.subarray(0, 8).equals(signature)) { console.error("templates/img/dsh.png is not a PNG"); process.exit(1); }
            const width = buf.readUInt32BE(16);
            const height = buf.readUInt32BE(20);
            console.log(`icon ok: ${width}x${height}, ${buf.length} bytes`);
            if (width !== height || width < 128) process.exit(1);
          '

      - name: The template still matches the published image
        # check-image-contract.mjs degrades to a warning when raw.githubusercontent.com
        # is unreachable (China). On a GitHub runner it is reachable, so run it once
        # more here and fail loudly on a drift instead of letting a warning pass.
        run: |
          set -euo pipefail
          output="$(node scripts/check-image-contract.mjs templates/dsh.xml)"
          printf '%s\n' "${output}"
          if printf '%s' "${output}" | grep -q 'entrypoint unreachable'; then
            echo 'the image entrypoint could not be fetched on a GitHub runner; refusing to skip silently' >&2
            exit 1
          fi
