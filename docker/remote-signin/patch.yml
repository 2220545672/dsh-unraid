# dsh-unraid — remote sign-in overlay.
#
# Loaded by the entrypoint as a launcher `--patch` layer (only while
# REMOTE_SIGNIN is on). Launcher layers are applied *after* the profile's own
# cordis.patch.yml, so the operator's layer is never edited, and turning the
# feature off removes every trace of it at the next start.
#
# `insert:` is required. A bare row targets an *existing* entry by id — the
# loader would warn "entry not found" and carry on, which is exactly how this
# would fail silently.
- insert:
    - id: remote-signin
      name: /etc/dsh/remote-signin/dsh-remote-signin.mjs
